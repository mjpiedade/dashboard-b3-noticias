name: build-apk

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:  # botão manual "Run workflow" no separador Actions

permissions:
  contents: write  # necessário para publicar/atualizar releases

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar debug APK
        run: gradle --no-daemon assembleDebug

      - name: Renomear APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/noticias-b3-${{ github.run_number }}.apk

      - name: Upload artifact (7 dias)
        uses: actions/upload-artifact@v4
        with:
          name: noticias-b3-apk
          path: android/out/*.apk
          retention-days: 7

      - name: Publicar/atualizar release "latest"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última build do widget
          body: |
            APK debug compilado a partir do commit ${{ github.sha }}.

            **Instalar no Android:**
            1. Descarrega o `.apk` abaixo diretamente no telemóvel.
            2. Abre-o. Se pedir, ativa "Permitir esta origem" e volta a tocar.
            3. Depois de instalado, adiciona o widget 4×2 ao ecrã principal.
          files: android/out/*.apk
          make_latest: true
          prerelease: false
